name: slowenia_app
description: Interaktywny plan wyjazdu do Słowenii 2026
publish_to: 'none'
version: 1.0.15+16

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  share_plus: ^12.0.2
  url_launcher: ^6.2.5
  go_router: ^14.0.0
  intl: ^0.20.2
  uuid: ^4.3.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.0
  # OTA — sprawdzanie i instalacja aktualizacji APK z GitHub Releases (Android).
  # Windows: fallback do otwarcia strony releases w przeglądarce.
  ota_update: ^7.1.0
  package_info_plus: ^8.0.2
  # Szyfrowanie planów pobieranych z publicznego repo trip_plans:
  # AES-256-GCM + klucz z hasła (PBKDF2). cryptography = czysty Dart (działa też
  # w narzędziu tool/encrypt_plan.dart). Hasło trzymane w secure storage.
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  # Skanowanie kodu QR z hasłem (żeby nie przepisywać długiego hasła ręcznie).
  mobile_scanner: ^5.2.3
  # Sterowanie głosowe czatu z agentem AI (rozpoznawanie mowy pl_PL, mobile).
  speech_to_text: ^7.3.0
  # GPS do funkcji „jestem tutaj" w dzienniku podróży.
  geolocator: ^13.0.1
  # Foreground service (Android): utrzymuje proces przy życiu, gdy agent AI
  # pracuje, a użytkownik zrzuci apkę w tło (inaczej system zamraża sieć).
  flutter_foreground_task: ^8.17.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  # Generacja kodu QR w narzędziu tool/make_qr.dart (matryca QR → SVG/HTML).
  qr: ^3.0.2

flutter:
  uses-material-design: true
  # Brak bundled planu — plany pobiera się z chmury (repo trip_plans) i trzyma
  # jako pobrane pliki w documents/plans/. assets/icon/ jest używane tylko przez
  # flutter_launcher_icons przy generowaniu ikon (nie jako runtime asset).

# Konfiguracja flutter_launcher_icons: generuje ikony launchera dla Androida
# (legacy mipmap + adaptive icon) oraz .ico dla Windows na podstawie pliku
# `assets/icon/icon.png` (1024x1024). Wygeneruj komendą:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1E6B52"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
