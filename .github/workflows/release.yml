name: Build and Release APK

# Odpalane przez git push tagu vX.Y.Z. Buduje podpisany APK i tworzy GitHub Release,
# do którego apka Słowenia 2026 OTA sprawdza aktualizacje.
on:
  push:
    tags:
      - 'v*'
  # Ręczne uruchomienie z UI GitHub (bez tworzenia release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pobierz zależności
        run: flutter pub get

      - name: Odtwórz keystore z sekretu
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK (release, podpisany, UNIWERSALNY)
        # Uniwersalny (fat) APK zawiera wszystkie ABI (arm64/arm32/x64) w jednym pliku.
        # KLUCZOWE dla OTA: serwis pobiera pierwszy asset .apk z Release — jeden uniwersalny
        # plik eliminuje ryzyko, że apka na arm64 pobierze wersję arm32. ~6 MB większy niż
        # split, ale zawsze poprawny na każdym urządzeniu.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION="0.0.0-dev"; fi
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: Zbierz APK pod nazwą wersji
        if: github.ref_type == 'tag'
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk  "release-artifacts/slowenia-app-${GITHUB_REF_NAME}.apk"
          ls -la release-artifacts

      - name: Utwórz GitHub Release z APK-ami
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Słowenia 2026 ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.apk

      - name: Upload artefaktów (jak nie ma tagu, dla wglądu)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: apk-preview
          path: build/app/outputs/flutter-apk/*.apk
